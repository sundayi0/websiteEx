<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>방문 카운트 쿠키</title>
<script>
// 쿠키 이름 (github.io 도메인의 다른 페이지와 겹치지 않도록 구체적인 이름 사용)
var NAME_KEY = "visit_username";
var COUNT_KEY = "visit_count";
var ONE_YEAR = 365 * 24 * 3600 * 1000; // 1년(밀리초)

// 쿠키 읽기: 없으면 null 반환
function GetCookie(name) {
	var pairs = document.cookie.split(";"); // 쿠키 문자열을 ;를 경계로 분할
	for (var i = 0; i < pairs.length; i++) {
		var pair = pairs[i].trim();          // 앞뒤 빈칸 제거
		var idx = pair.indexOf("=");         // 첫 번째 = 위치 (값에 = 가 있어도 안전)
		if (idx === -1) continue;
		if (pair.substring(0, idx) === name) {
			return decodeURIComponent(pair.substring(idx + 1));
		}
	}
	return null;
}

// 쿠키 쓰기: expireDate가 null이면 브라우저 종료 시 삭제
function SetCookie(name, value, expireDate) {
	var cookieStr = name + "=" + encodeURIComponent(value) + "; path=/; SameSite=Lax";
	if (expireDate != null) {
		cookieStr += "; expires=" + expireDate.toUTCString();
	}
	document.cookie = cookieStr;
}

// 쿠키 삭제: 만료일을 과거로 설정
function DeleteCookie(name) {
	document.cookie = name + "=; path=/; expires=Thu, 01 Jan 1970 00:00:00 GMT";
}

// 테스트용: 쿠키를 지우고 새로고침
function ResetVisit() {
	DeleteCookie(NAME_KEY);
	DeleteCookie(COUNT_KEY);
	location.reload();
}
</script>
</head>
<body>
<script>
var username = GetCookie(NAME_KEY);
var count = GetCookie(COUNT_KEY);
var expire = new Date(); // 현재 시간

if (username == null) {
	username = prompt("이름을 입력해 주십시오.", "");
	if (username == null || username.trim() === "") {
		alert("이름을 입력하시면 보다 나은 서비스를 제공받을 수 있습니다.");
		username = "아무개";
	} else {
		username = username.trim();
		expire.setTime(expire.getTime() + ONE_YEAR); // 1년 후
		SetCookie(NAME_KEY, username, expire);
	}
}

// 방문 횟수: 쿠키가 없으면 1, 있으면 +1
count = (count == null) ? 1 : parseInt(count, 10) + 1;
expire.setTime(new Date().getTime() + ONE_YEAR); // 1년 후
SetCookie(COUNT_KEY, count, expire);

document.write('<p>어서오십시오. ' + username + '님의 ' + count + '번째 방문을 환영합니다!</p>');
</script>
<p><button type="button" onclick="ResetVisit()">쿠키 삭제 후 다시 시작</button></p>
</body>
</html>
